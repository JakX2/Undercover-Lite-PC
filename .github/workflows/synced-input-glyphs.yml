name: Build Input-Aligned Undercover Glyphs
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/UndercoverLite.Core/UndercoverKeyboardProfile.cs'
      - 'tools/build_synced_input_glyphs.py'
      - 'tests/check_synced_input_glyphs.py'
      - '.github/workflows/synced-input-glyphs.yml'
  pull_request:
    paths:
      - 'src/UndercoverLite.Core/UndercoverKeyboardProfile.cs'
      - 'tools/build_synced_input_glyphs.py'
      - 'tests/check_synced_input_glyphs.py'
      - '.github/workflows/synced-input-glyphs.yml'
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - name: Validate exact 0.9 input alignment
        run: python tests/check_synced_input_glyphs.py
      - name: Build 3 complete, original PC keyboard glyph themes
        run: python tools/build_synced_input_glyphs.py --out dist/Undercover_Lite_PC_Input_Aligned_Glyphs_0_11
      - name: Upload installable original-art ZIP
        uses: actions/upload-artifact@v4
        with:
          name: UndercoverLitePC-input-aligned-glyphs-0.11
          path: dist/Undercover_Lite_PC_Input_Aligned_Glyphs_0_11.zip
          if-no-files-found: error
